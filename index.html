<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test de menu</title>
  <link rel="stylesheet" href="src/css/styles.css">
</head>

<body>
  <header class="header header--home">

    <!-- Menu principal -->
    <!-- popovertarget relie ce bouton au menu (id="menu") : un clic l'ouvre ou le ferme, sans JavaScript.
         Échap ou un clic à côté du menu le ferment aussi. -->
    <button class="burger" type="button" popovertarget="menu" aria-label="Menu">
      🍔
    </button>

    <!-- L'attribut popover cache le menu par défaut. Il ne s'affiche que quand un bouton le demande. -->
    <nav class="menu" id="menu" popover aria-label="Main menu">
      <!-- popovertargetaction="hide" : ce bouton ne fait que fermer le menu.
           autofocus place le focus dessus à l'ouverture, pour qu'on puisse fermer au clavier avec Entrée. -->
      <button class="menu__close burger burger--close" type="button" popovertarget="menu" popovertargetaction="hide"
        aria-label="Close the menu" autofocus>
        🍔
      </button>
      <ul class="menu__list">
        <li class="menu__item"><a class="menu__link" href="index.html">Accueil</a></li>
        <li class="menu__item"><a class="menu__link" href="cats/index.html">Les chats</a></li>
        <li class="menu__item"><a class="menu__link" href="dogs/index.html">Les chiens</a></li>
      </ul>
    </nav>
    <!-- Fin du menu principal -->
  </header>

  <!-- Contenu principal de la page -->
  <main>
    <h1>Test de menu</h1>
    <p>
      Lorem, ipsum dolor sit amet consectetur adipisicing elit. Veniam fugit maiores accusamus quisquam ad veritatis
      officiis numquam ex rem porro, amet sapiente eaque. Rerum excepturi eaque atque ipsa quos mollitia.
    </p>
  </main>
  <!-- Fin du contenu principal -->

</body>

</html>
